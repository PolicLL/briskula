<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="app" id="app">
  <header>
    <div class="brand">Briškula<small id="modeTag">na duplo</small></div>
    <div class="controls">
      <select id="mode" aria-label="Game mode">
        <option value="2">Na duplo</option>
        <option value="1">Single</option>
      </select>
      <span class="chip online-only" id="tableCode">ONLINE</span>
      <select id="difficulty" class="bot-only" aria-label="Bot strength">
        <option value="hard">Bot: Hard</option>
        <option value="normal">Bot: Normal</option>
        <option value="easy">Bot: Easy</option>
      </select>
      <button class="btn bot-only" id="onlineBtn">Online</button>
      <button class="btn online-only" id="leaveBtn">Leave</button>
      <button class="btn" id="rulesBtn">Rules</button>
      <button class="btn primary" id="newBtn">New game</button>
    </div>
  </header>

  <section class="seat opp" aria-label="Bot">
    <div class="seat-info"><span class="seat-name" id="opName">Bot</span><span class="score" id="botScore">0</span><span class="seat-meta" id="botMeta"></span></div>
    <div class="hand" id="botHand"></div>
  </section>

  <section class="mid">
    <div class="deckzone" id="deckzone"></div>
    <div class="table" id="table"><div class="ring"></div></div>
  </section>

  <section class="seat me" id="meSeat" aria-label="Your hand">
    <div class="seat-info"><span class="seat-name">You</span><span class="score" id="meScore">0</span><span class="seat-meta" id="meMeta"></span></div>
    <div class="hand" id="meHand"></div>
  </section>

  <div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="foot"><label><input type="checkbox" id="showScore" checked> Show running points</label><span id="record"></span></div>
  </div>
</div>

<div class="overlay" id="overlay" hidden><div class="panel" id="panel"></div></div>
